colors:
  background_color: 'f4efe6'
  white: 'f4efe6'
  red: 'aa544d'
  green: '637827'
  yellow: 'aa5f1b'
  blue: '46778d'
  pink: '85647f'
  cyan: '477f5e'

  light_red: 'bb625b'
  light_green: '718735'
  light_blue: '53879e'
  light_pink: '95728e'
  light_cyan: '548f6c'

  black: 'e4d6c6'
