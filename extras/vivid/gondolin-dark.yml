colors:
  background_color: '080A0D'
  white: 'D6DAE7'
  red: 'FF7A77'
  green: 'B9EC86'
  yellow: 'FFE878'
  blue: '83AEF8'
  pink: 'FF8DFF'
  cyan: '83AEF8'

  light_red: 'FF7774'
  light_green: 'B9FF6C'
  light_blue: '71FEFF'
  light_pink: 'FF8DFF'
  light_cyan: '71FFDF'

  black: '060809'
  gray: '0E1114'
  darkgray: '0d0f13'
  darkergray: '080A0D'

core:
  normal_text: {}
  regular_file: {}
  reset_to_normal: {}

  directory:
    foreground: light_blue

  symlink:
    foreground: light_pink

  multi_hard_link: {}

  fifo:
    foreground: black
    background: blue

  socket:
    foreground: black
    background: light_pink

  door:
    foreground: black
    background: light_pink

  block_device:
    foreground: light_cyan
    background: darkergray

  character_device:
    foreground: light_pink
    background: darkergray

  broken_symlink:
    foreground: black
    background: red

  missing_symlink_target:
    foreground: black
    background: red

  setuid: {}

  setgid: {}

  file_with_capability: {}

  sticky_other_writable: {}

  other_writable: {}

  sticky: {}

  executable_file:
    foreground: light_red

text:
  special:
    foreground: background_color
    background: yellow

  todo:
    font-style: bold

  licenses:
    foreground: gray

  configuration:
    foreground: yellow

  other:
    foreground: yellow

markup:
  foreground: yellow

programming:
  source:
    foreground: green

  tooling:
    foreground: light_green

    continuous-integration:
      foreground: green

media:
  foreground: pink

office:
  foreground: cyan

archives:
  foreground: light_cyan
  font-style: underline

executable:
  foreground: light_red
  font-style: bold

unimportant:
  foreground: darkgray
