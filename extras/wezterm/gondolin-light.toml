# -----------------------------------------------------------------------------
# Gondolin Light
# Upstream: https://github.com/wunki/gondolin.nvim/blob/main/extras/wezterm/gondolin-light.toml
# URL: https://wezterm.org/config/appearance.html
# -----------------------------------------------------------------------------

[colors]
foreground = "#5c6a72"
background = "#f4efe6"
cursor_bg = "#46778d"
cursor_border = "#46778d"
cursor_fg = "#f4efe6"
selection_bg = "#e8e5d5"
selection_fg = "#5c6a72"
split = "#bec4b4"
compose_cursor = "#637827"
scrollbar_thumb = "#bec4b4"

ansi = [
  "#5c6a72",
  "#aa544d",
  "#637827",
  "#aa5f1b",
  "#46778d",
  "#85647f",
  "#477f5e",
  "#f4efe6",
]
brights = [
  "#748278",
  "#bb625b",
  "#718735",
  "#bd6e22",
  "#53879e",
  "#95728e",
  "#548f6c",
  "#fffaf3",
]

[colors.indexed]
16 = "#aa5f1b"
17 = "#aa544d"

[colors.tab_bar]
background = "#f8f1e7"
inactive_tab_edge = "#637827"

[colors.tab_bar.active_tab]
fg_color = "#46778d"
bg_color = "#f4efe6"
intensity = "Bold"

[colors.tab_bar.inactive_tab]
fg_color = "#829181"
bg_color = "#f8f1e7"

[colors.tab_bar.inactive_tab_hover]
fg_color = "#aa544d"
bg_color = "#f4efe6"

[colors.tab_bar.new_tab]
fg_color = "#829181"
bg_color = "#f8f1e7"

[colors.tab_bar.new_tab_hover]
fg_color = "#aa544d"
bg_color = "#f4efe6"
intensity = "Bold"

[metadata]
name = "gondolin-light"
author = "Simon Ho"
origin_url = "https://github.com/wunki/gondolin.nvim/blob/main/extras/wezterm/gondolin-light.toml"
